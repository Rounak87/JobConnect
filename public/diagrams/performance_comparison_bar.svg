<?xml version="1.0" encoding="utf-8"?>
<svg width="900" height="380" viewBox="0 0 900 380" xmlns="http://www.w3.org/2000/svg">
  <style>
    .label{font-family: Arial, Helvetica, sans-serif; font-size:12px; fill:#222}
    .title{font-family: Arial, Helvetica, sans-serif; font-size:16px; fill:#111; font-weight:600}
    .tick{font-family: Arial, Helvetica, sans-serif; font-size:11px; fill:#666}
  </style>
  <rect width="100%" height="100%" fill="#fff"/>
  <text x="40" y="24" class="title">Performance comparison — Accuracy &amp; F1 (percent)</text>

  <!-- layout -->
  <!-- axes -->
  <line x1="70" y1="330" x2="840" y2="330" stroke="#ccc" />
  <line x1="70" y1="30" x2="70" y2="330" stroke="#eee" />

  <!-- y ticks -->
  <!-- values 0,25,50,75,100 -->
  <g stroke="#eee" stroke-width="1">
    <line x1="70" y1="330" x2="840" y2="330" />
    <line x1="70" y1="245" x2="840" y2="245" />
    <line x1="70" y1="160" x2="840" y2="160" />
    <line x1="70" y1="75" x2="840" y2="75" />
  </g>
  <text x="40" y="334" class="tick">0</text>
  <text x="40" y="250" class="tick">25</text>
  <text x="40" y="165" class="tick">50</text>
  <text x="40" y="80" class="tick">75</text>
  <text x="34" y="44" class="tick">100</text>

  <!-- legend -->
  <g transform="translate(620,30)">
    <rect x="0" y="0" width="190" height="80" rx="6" fill="#fafafa" stroke="#eee" />
    <g transform="translate(10,12)">
      <rect x="0" y="0" width="14" height="10" fill="#1f77b4" /><text x="22" y="9" class="label">OurModel</text>
      <rect x="0" y="18" width="14" height="10" fill="#ff7f0e" /><text x="22" y="27" class="label">Baseline A</text>
      <rect x="0" y="36" width="14" height="10" fill="#2ca02c" /><text x="22" y="45" class="label">Baseline B</text>
      <rect x="0" y="54" width="14" height="10" fill="#d62728" /><text x="22" y="63" class="label">SOTA</text>
    </g>
  </g>

  <!-- groups and bars -->
  <!-- config -->
  <!-- chart area: left margin 70, baseline y=330, chartHeight=300 -->

  <!-- group 0 (Accuracy) -->
  <!-- groupLeft = 90, barWidth=30, gap=10 -->
  <!-- Accuracy values: OurModel 88, BaselineA 82, BaselineB 80, SOTA 91 -->
  <!-- heights: 264,246,240,273 ; y = 330 - height -->

  <!-- OurModel -->
  <rect x="90" y="66" width="30" height="264" fill="#1f77b4" rx="4" />
  <text x="105" y="58" class="label" text-anchor="middle" fill="#1f77b4">88%</text>
  <!-- Baseline A -->
  <rect x="130" y="84" width="30" height="246" fill="#ff7f0e" rx="4" />
  <text x="145" y="76" class="label" text-anchor="middle" fill="#ff7f0e">82%</text>
  <!-- Baseline B -->
  <rect x="170" y="90" width="30" height="240" fill="#2ca02c" rx="4" />
  <text x="185" y="82" class="label" text-anchor="middle" fill="#2ca02c">80%</text>
  <!-- SOTA -->
  <rect x="210" y="57" width="30" height="273" fill="#d62728" rx="4" />
  <text x="225" y="49" class="label" text-anchor="middle" fill="#d62728">91%</text>

  <!-- group label -->
  <text x="165" y="356" class="label" text-anchor="middle">Accuracy</text>

  <!-- group 1 (F1) -->
  <!-- groupLeft = 470 -->
  <!-- F1 values: OurModel 86, BaselineA 79, BaselineB 77, SOTA 89 -->
  <!-- heights: 258,237,231,267 ; y = 330 - height -->
  <rect x="470" y="72" width="30" height="258" fill="#1f77b4" rx="4" />
  <text x="485" y="64" class="label" text-anchor="middle" fill="#1f77b4">86%</text>
  <rect x="510" y="93" width="30" height="237" fill="#ff7f0e" rx="4" />
  <text x="525" y="85" class="label" text-anchor="middle" fill="#ff7f0e">79%</text>
  <rect x="550" y="99" width="30" height="231" fill="#2ca02c" rx="4" />
  <text x="565" y="91" class="label" text-anchor="middle" fill="#2ca02c">77%</text>
  <rect x="590" y="63" width="30" height="267" fill="#d62728" rx="4" />
  <text x="605" y="55" class="label" text-anchor="middle" fill="#d62728">89%</text>

  <text x="545" y="356" class="label" text-anchor="middle">F1 score</text>

  <!-- footer/note -->
  <text x="70" y="370" class="tick">Note: values are illustrative/synthetic; update with real measurements as needed.</text>
</svg>
