<?xml version="1.0" encoding="utf-8"?>
<svg width="600" height="400" viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
    <style>
        .grid { stroke: #e0e0e0; stroke-width: 1; }
        .axis { stroke: #888; stroke-width: 1.5; }
        .text-label { font-family: sans-serif; font-size: 11px; fill: #555; }
        .title { font-family: sans-serif; font-size: 16px; font-weight: bold; fill: #222; }
    </style>
    <rect width="100%" height="100%" fill="#fff"/>
    
    <text x="20" y="30" class="title">Cost vs Accuracy Scatter Plot</text>

    <!-- axes -->
    <line x1="50" y1="350" x2="550" y2="350" class="axis" />
    <line x1="50" y1="50" x2="50" y2="350" class="axis" />
    
    <!-- Y axis: Accuracy (0 to 100) -->
    <text x="25" y="55" class="text-label">100%</text>
    <line x1="45" y1="50" x2="550" y2="50" class="grid" />
    <text x="30" y="205" class="text-label">50%</text>
    <line x1="45" y1="200" x2="550" y2="200" class="grid" />
    <!-- X axis: Cost -->
    <text x="250" y="385" class="text-label" font-weight="bold">Operational Cost (Normalized)</text>
    
    <text x="45" y="370" class="text-label">Low</text>
    <text x="495" y="370" class="text-label">High</text>

    <!-- Plot points -->
    <!-- Our Solution (Low Cost, High Accuracy) x=150, y=80 -->
    <circle cx="150" cy="80" r="12" fill="#1f77b4" opacity="0.8"/>
    <text x="150" y="60" class="text-label" text-anchor="middle" font-weight="bold" fill="#1f77b4">Our Platform</text>
    
    <!-- Comp A (High Cost, High Accuracy) x=450, y=90 -->
    <circle cx="450" cy="90" r="8" fill="#ff7f0e" opacity="0.8"/>
    <text x="450" y="75" class="text-label" text-anchor="middle">Enterprise AI A</text>

    <!-- Comp B (Med Cost, Med Accuracy) x=350, y=180 -->
    <circle cx="350" cy="180" r="8" fill="#2ca02c" opacity="0.8"/>
    <text x="350" y="165" class="text-label" text-anchor="middle">Legacy Tool B</text>

    <!-- Comp C (Low Cost, Low Accuracy) x=180, y=280 -->
    <circle cx="180" cy="280" r="8" fill="#d62728" opacity="0.8"/>
    <text x="180" y="265" class="text-label" text-anchor="middle">OpenSource C</text>

    <!-- Legend -->
    <rect x="420" y="20" width="150" height="90" fill="#fcfcfc" stroke="#eee" rx="4"/>
    <circle cx="440" cy="40" r="5" fill="#1f77b4"/>
    <text x="455" y="44" class="text-label">JobConnect (Proposed)</text>
    <circle cx="440" cy="60" r="5" fill="#ff7f0e"/>
    <text x="455" y="64" class="text-label">Other Competitors</text>
</svg>
