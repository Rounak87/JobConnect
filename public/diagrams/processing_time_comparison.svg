<?xml version="1.0" encoding="utf-8"?>
<svg width="800" height="400" xmlns="http://www.w3.org/2000/svg">
  <style>
    .title { font: bold 16px sans-serif; fill: #333; }
    .axis-label { font: 12px sans-serif; fill: #666; }
    .tick { font: 10px sans-serif; fill: #999; }
    .legend { font: 12px sans-serif; fill: #444; }
  </style>
  
  <rect width="100%" height="100%" fill="#ffffff"/>
  
  <text x="30" y="30" class="title">Processing Time Comparison (ms per document)</text>
  
  <!-- Y Axis -->
  <line x1="60" y1="340" x2="60" y2="60" stroke="#ccc" stroke-width="1"/>
  <!-- Y Ticks -->
  <line x1="55" y1="340" x2="750" y2="340" stroke="#eee" stroke-width="1"/>
  <text x="30" y="344" class="tick">0</text>
  
  <line x1="55" y1="270" x2="750" y2="270" stroke="#eee" stroke-width="1"/>
  <text x="25" y="274" class="tick">500</text>

  <line x1="55" y1="200" x2="750" y2="200" stroke="#eee" stroke-width="1"/>
  <text x="20" y="204" class="tick">1000</text>

  <line x1="55" y1="130" x2="750" y2="130" stroke="#eee" stroke-width="1"/>
  <text x="20" y="134" class="tick">1500</text>

  <line x1="55" y1="60" x2="750" y2="60" stroke="#eee" stroke-width="1"/>
  <text x="20" y="64" class="tick">2000</text>

  <!-- X Axis -->
  <line x1="60" y1="340" x2="750" y2="340" stroke="#ccc" stroke-width="1"/>

  <!-- X Ticks and Labels -->
  <text x="150" y="360" class="axis-label" text-anchor="middle">Our Platform</text>
  <text x="350" y="360" class="axis-label" text-anchor="middle">Competitor X</text>
  <text x="550" y="360" class="axis-label" text-anchor="middle">Competitor Y</text>
  
  <!-- Bars -->
  <!-- 2000ms = 280px height (scale: 0.14px / ms) -->
  
  <!-- Our Platform: 450ms -> 63px -->
  <rect x="120" y="277" width="60" height="63" fill="#28a745" rx="3"/>
  <text x="150" y="267" class="tick" text-anchor="middle">450ms</text>

  <!-- Competitor X: 1100ms -> 154px -->
  <rect x="320" y="186" width="60" height="154" fill="#dc3545" rx="3"/>
  <text x="350" y="176" class="tick" text-anchor="middle">1100ms</text>

  <!-- Competitor Y: 1450ms -> 203px -->
  <rect x="520" y="137" width="60" height="203" fill="#ffc107" rx="3"/>
  <text x="550" y="127" class="tick" text-anchor="middle">1450ms</text>

  <!-- Legend -->
  <rect x="620" y="20" width="12" height="12" fill="#28a745" rx="2"/>
  <text x="640" y="31" class="legend">Our System</text>
  
  <rect x="620" y="40" width="12" height="12" fill="#dc3545" rx="2"/>
  <text x="640" y="51" class="legend">Traditional API</text>
  
  <rect x="620" y="60" width="12" height="12" fill="#ffc107" rx="2"/>
  <text x="640" y="71" class="legend">Manual Analysis</text>

</svg>
